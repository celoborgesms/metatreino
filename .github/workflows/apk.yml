# Monta o APK do MetaTreino (para instalar sem a Play Store) e publica em "Releases".
# Roda sozinho quando a pasta android-twa muda e pode ser rodado à mão em Actions › "APK Android" › Run workflow.
# Precisa de 2 secrets no repositório (Settings › Secrets and variables › Actions):
#   KEYSTORE_BASE64   = conteúdo do arquivo metatreino.jks.base64.txt
#   KEYSTORE_PASSWORD = a senha da chave
name: APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-twa/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Conferir os secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Faltam os secrets KEYSTORE_BASE64 e/ou KEYSTORE_PASSWORD (Settings › Secrets and variables › Actions)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/metatreino.jks"

      - name: Versão do app
        id: versao
        run: |
          V=$(grep -oP "const APP_VERSION = '\K[^']+" app.js || echo "sem-versao")
          echo "nome=$V" >> "$GITHUB_OUTPUT"

      - name: Montar o APK assinado
        working-directory: android-twa
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/metatreino.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.versao.outputs.nome }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renomear
        run: cp android-twa/app/build/outputs/apk/release/app-release.apk MetaTreino.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MetaTreino-apk
          path: MetaTreino.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: MetaTreino APK ${{ steps.versao.outputs.nome }} (montagem ${{ github.run_number }})
          body: |
            APK do MetaTreino para instalar sem a Play Store (abre o metatreino.app em tela cheia).
            Baixe o arquivo MetaTreino.apk pelo celular e toque nele para instalar.
          files: MetaTreino.apk
          make_latest: true
